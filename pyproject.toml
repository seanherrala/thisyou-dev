[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thisyou"
version = "0.1.0"
description = "Bluesky pattern visualization and graph analysis toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sean Herrala" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
